<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Files - AutoCapture</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <script src="../shared/theme.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--app-bg);
      margin: 0;
      color: var(--app-text);
    }
    .header {
      background-color: var(--app-header);
      color: var(--app-header-text);
      padding: 10px 40px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .header img {
      width: 24px;
      height: 24px;
      filter: brightness(0) invert(1);
    }
    .header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 500;
    }
    .nav {
      background: var(--app-surface);
      padding: 10px 40px;
      border-bottom: 1px solid var(--app-border);
      display: flex;
      gap: 20px;
    }
    .nav a {
      text-decoration: none;
      color: var(--app-muted);
      font-size: 14px;
      font-weight: 500;
    }
    .nav a.active {
      color: var(--app-accent);
      border-bottom: 2px solid var(--app-accent);
      padding-bottom: 8px;
    }
    .container {
      max-width: 1000px;
      margin: 30px auto;
      background: var(--app-surface);
      padding: 40px;
      border-radius: 4px;
      box-shadow: 0 1px 3px var(--app-shadow);
      min-height: 500px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .toolbar h2 {
      margin: 0;
      border-bottom: 0;
      padding-bottom: 0;
    }
    .bulk-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--app-muted);
    }
    .btn {
      border: 1px solid var(--app-border);
      border-radius: 4px;
      background: var(--app-elevated);
      color: var(--app-text);
      cursor: pointer;
      font-weight: 600;
      padding: 7px 10px;
    }
    .btn:hover:not(:disabled) {
      border-color: var(--app-accent);
      color: var(--app-accent-hover);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-danger {
      border-color: var(--app-danger-soft);
      color: var(--app-danger);
    }
    h2 {
      font-size: 18px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--app-border-soft);
      padding-bottom: 10px;
    }
    .file-list {
      width: 100%;
      border-collapse: collapse;
    }
    .file-list th {
      text-align: left;
      font-size: 12px;
      color: var(--app-subtle);
      text-transform: uppercase;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--app-border);
    }
    .file-list td {
      padding: 15px 0;
      border-bottom: 1px solid var(--app-border-soft);
      font-size: 14px;
    }
    .file-name {
      color: var(--app-accent);
      text-decoration: none;
      word-break: break-all;
    }
    .file-date {
      color: var(--app-subtle);
      width: 150px;
    }
    .actions {
      text-align: right;
      width: 100px;
    }
    .select-col {
      width: 34px;
    }
    .file-path {
      color: var(--app-subtle);
      display: block;
      font-size: 12px;
      margin-top: 4px;
      word-break: break-all;
    }
    .file-status {
      color: var(--app-subtle);
      display: block;
      font-size: 12px;
      margin-top: 4px;
    }
    .btn-delete {
      color: var(--app-danger);
      cursor: pointer;
      font-size: 12px;
    }
    .empty-msg {
      text-align: center;
      color: var(--app-subtle);
      padding: 50px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon128.png" alt="Logo">
    <h1>AutoCapture</h1>
  </div>
  
  <div class="nav">
    <a href="../options/options.html">Options</a>
    <a href="#" class="active">Files</a>
  </div>

  <div class="container">
    <div class="toolbar">
      <h2>Captured Files History</h2>
      <div class="bulk-actions">
        <span id="selectedCount">0 selected</span>
        <button id="deleteSelectedBtn" class="btn btn-danger" type="button" disabled>Delete selected</button>
      </div>
    </div>
    
    <table class="file-list" id="fileTable">
      <thead>
        <tr>
          <th class="select-col"><input id="selectAll" type="checkbox" aria-label="Select all files"></th>
          <th>Page URL</th>
          <th>Captured At</th>
          <th class="actions">Action</th>
        </tr>
      </thead>
      <tbody id="fileList">
        <!-- Files populated by JS -->
      </tbody>
    </table>
    <div id="emptyMsg" class="empty-msg" style="display:none;">No screenshots captured yet.</div>
  </div>

  <script src="history.js"></script>
</body>
</html>
