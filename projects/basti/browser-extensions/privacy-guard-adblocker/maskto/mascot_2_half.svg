<svg xmlns="http://www.w3.org/2000/svg" width="168" height="184" viewBox="-10 -10 62 76">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)" />
      <stop offset="42%" stop-color="rgba(255,255,255,0)" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f8a73" />
      <stop offset="100%" stop-color="#115144" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#115144" flood-opacity="0.28"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="shieldClip">
      <polygon points="21,0 36.96,5.52 34.44,33.12 21,46 7.56,33.12 5.04,5.52" />
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <g clip-path="url(#shieldClip)">
      <rect x="0" y="0" width="42" height="46" rx="13" ry="18" fill="url(#grad2)" />
      <rect x="0" y="0" width="42" height="46" rx="13" ry="18" fill="url(#grad1)" />
    </g>
  </g>

  <rect x="9" y="17" width="24" height="13" rx="6.5" fill="rgba(8, 38, 34, 0.55)" />

  <!-- Eyebrow (moved scan line to y=18) -->
  <rect x="11" y="18" width="20" height="2" rx="1" fill="rgba(173, 255, 226, 0.9)" filter="url(#glow)" opacity="0.6" />

  <!-- Eyes: Half -->
  <ellipse cx="18.5" cy="23.5" rx="2.5" ry="1.5" fill="#ffffff" />
  <ellipse cx="23.5" cy="23.5" rx="2.5" ry="1.5" fill="#ffffff" />
</svg>
