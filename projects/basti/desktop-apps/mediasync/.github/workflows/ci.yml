name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Server install + typecheck + test
        working-directory: server
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Web install + typecheck + build
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Docker build (no push)
        run: docker build -t mediasync:ci .
