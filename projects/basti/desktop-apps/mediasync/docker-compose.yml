services:
  mediasync:
    image: ghcr.io/bastild/mediasync:latest
    # To build locally instead of pulling the published image, comment out the
    # "image:" line above and uncomment the next line:
    # build: .
    container_name: mediasync
    ports:
      - "8095:3000" # http://<server-ip>:8095  (change the host port if 8095 is taken)
    environment:
      # File ownership for renamed/moved files (run `id` on your NAS user)
      PUID: "1000"
      PGID: "1000"
      # Web login – CHANGE THESE
      AUTH_PASSWORD: "changeme"
      SESSION_SECRET: "change-this-to-a-long-random-string"
      # Optional integrations (can also be set later in the UI)
      TMDB_KEY: ""
      PLEX_URL: "" # e.g. http://192.168.1.10:32400
      PLEX_TOKEN: ""
      # Mount roots the app may scan / rename / move within (comma separated)
      MEDIA_ROOTS: "/media"
    volumes:
      - /DATA/AppData/mediasync:/config # database + settings (persistent)
      - /DATA/Media/Movies:/media/movies # adjust to your real Plex movie path
      - /DATA/Media/Series:/media/series # adjust to your real Plex series path
      # Add more disks/USB to enable moving between them, e.g.:
      # - /DATA/Media2:/media/disk2
      # - /mnt/usb:/media/usb
    restart: unless-stopped
