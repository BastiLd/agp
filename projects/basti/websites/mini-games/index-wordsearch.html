<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHS Villach – Word Search CAPTCHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --blue:#4a90e2;
  --bg:#f1f3f6;
  --card:#ffffff;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--bg);
  font-family:Inter,system-ui,sans-serif;
}

.card{
  width:380px;
  background:var(--card);
  border-radius:14px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
  padding:16px;
}

.header{
  background:var(--blue);
  color:white;
  padding:14px;
  border-radius:10px;
  margin-bottom:14px;
}

.header h1{
  margin:0;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
}

.cell{
  background:#eef1f6;
  border-radius:6px;
  height:34px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:600;
  cursor:pointer;
  transition:all .25s ease;
}

.cell:hover{
  background:#dbe7ff;
}

.cell.selected{
  background:#4a90e2;
  color:white;
  transform:scale(1.05);
}

.cell.found{
  background:#6ddf88;
  color:white;
}

.words{
  margin-top:14px;
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<div class="card">
  <div class="header">
    <h1>Select all HTML/CSS Words</h1>
  </div>

  <div class="grid" id="grid"></div>

  <div class="words" id="words"></div>
</div>

<script>
const words=["DIV","CSS","GRID","FLEX","HTML","COLOR"];
const size=10;
const gridEl=document.getElementById("grid");
const wordsEl=document.getElementById("words");

let grid=Array.from({length:size},()=>Array(size).fill(""));

function place(word){
  const row=Math.floor(Math.random()*size);
  const col=Math.floor(Math.random()*(size-word.length));
  for(let i=0;i<word.length;i++){
    grid[row][col+i]=word[i];
  }
}

words.forEach(place);

const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
for(let r=0;r<size;r++){
  for(let c=0;c<size;c++){
    if(!grid[r][c]) grid[r][c]=letters[Math.floor(Math.random()*letters.length)];
  }
}

grid.forEach((row,r)=>{
  row.forEach((char,c)=>{
    const div=document.createElement("div");
    div.className="cell";
    div.textContent=char;
    div.onclick=()=>div.classList.toggle("selected");
    gridEl.appendChild(div);
  });
});

wordsEl.textContent="Words: "+words.join(", ");
</script>

</body>
</html>
