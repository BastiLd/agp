<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Vorderste Reihe, dunkler Wüstenstein. Auf dem durchgehenden Sockel
       unten steht der Footer-Text. Nahtdüne doppelt (x=-150 und x=1050). -->
  <g fill="#5d4023">
    <rect x="-150" y="160" width="300" height="140" rx="150"/>
    <rect x="1050" y="160" width="300" height="140" rx="150"/>
    <rect x="90" y="135" width="340" height="165" rx="170"/>
    <rect x="480" y="180" width="260" height="120" rx="130"/>
    <rect x="760" y="150" width="320" height="150" rx="160"/>
    <rect x="0" y="215" width="1200" height="85"/>
  </g>
</svg>
