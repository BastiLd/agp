<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Dritte Reihe, Wüstenstein. Nahtdüne doppelt (x=-180 und x=1020). -->
  <g fill="#a97a44">
    <rect x="-180" y="150" width="360" height="150" rx="180"/>
    <rect x="1020" y="150" width="360" height="150" rx="180"/>
    <rect x="140" y="125" width="240" height="175" rx="120"/>
    <rect x="440" y="180" width="340" height="120" rx="170"/>
    <rect x="820" y="145" width="220" height="155" rx="110"/>
    <rect x="0" y="240" width="1200" height="60"/>
  </g>
</svg>
