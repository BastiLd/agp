    <!-- CSS -->

</head>
<body>

<header>
    <nav>
        <div class="logo"><i class="fas fa-laptop-code"></i> DigitalFAB</div>
        <div class="menu-toggle"><i class="fas fa-bars"></i></div>

            <li><a href="imprint.html"><i class="fas fa-file-alt"></i> Impressum</a></li>
        </ul>
    </nav>
</header>
<main>
<section class="contact">
    <div class="container">
        <h2>Kontakt</h2>
        <div class="contact-container">
            <div class="contact-info">
                <p><i class="fas fa-map-marker-alt"></i> DigitalFAB GmbH, Musterstraße 12, 12345 Musterstadt</p>
                <p><i class="fas fa-phone"></i> Telefon: 01234 567890</p>
                <p><i class="fas fa-envelope"></i> E-Mail: info@digitalfab.de</p>
            </div>
            <div class="contact-form">
                <form action="#" method="post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Ihr Name" required>
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="Ihre E-Mail-Adresse" required>
                    <label for="message">Nachricht</label>
                    <textarea id="message" name="message" rows="5" placeholder="Ihre Nachricht" required></textarea>
                    <button type="submit" class="btn">Absenden</button>
                </form>
            </div>
        </div>
    </div>
</section>
</main>
<footer>
    <div class="container">
        <p>&copy; 2025 DigitalFAB GmbH. Alle Rechte vorbehalten.</p>
        <div class="social">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
        </div>
    </div>
</footer>

</body>
