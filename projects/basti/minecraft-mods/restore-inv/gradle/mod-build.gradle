// Gemeinsamer Build-Logik fuer alle Mod-Subprojekte.
// Jedes Subprojekt setzt vorher seine MC-/Loom-spezifischen
// Properties (minecraft_version, yarn_mappings, loader_version,
// fabric_api_version, mod_dep_minecraft) sowie die Loom-Version
// in seiner eigenen build.gradle.

apply plugin: 'maven-publish'
apply plugin: 'java'

group   = rootProject.mod_group
version = rootProject.mod_version

// Archiv-Label: standardmaessig 'mc<version>' (Per-Version-Builds), aber via
// 'archive_label'-Property ueberschreibbar (Umbrella-Builds, z. B. mc1.21-1.21.4).
def mcLabel = project.findProperty('archive_label') ?: "mc${project.minecraft_version}"
base.archivesName = "${rootProject.mod_archives_name}-${mcLabel}"

repositories {
    maven {
        name = 'Fabric'
        url  = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings  "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version',   rootProject.mod_version
    inputs.property 'mod_id',    rootProject.mod_id
    inputs.property 'mc_range',  project.mod_dep_minecraft

    filesMatching('fabric.mod.json') {
        expand 'version': rootProject.mod_version,
               'mod_id':  rootProject.mod_id,
               'mc_range': project.mod_dep_minecraft
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set("${rootProject.mod_archives_name}-${mcLabel}")
    archiveVersion.set(rootProject.mod_version)

    from(rootProject.file('LICENSE')) {
        rename { "${it}_${rootProject.mod_archives_name}" }
    }
}
