org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Wenn dein lokales JDK 21 nicht automatisch gefunden wird, lege eine
# Datei "gradle-local.properties" oder setze JAVA_HOME, oder trage hier ein:
# org.gradle.java.home=C:\\Pfad\\zu\\deinem\\jdk-21

# ============================================================
# Mod-Metadaten - EINZIGE Quelle der Wahrheit
# ------------------------------------------------------------
# Erhoehe die Version mit:
#   python bump_version.py [patch|minor|major|<x.y.z>]
# Optional: --tag (Git-Tag) oder --commit (Commit + Tag).
# Diese Version wird fuer ALLE unterstuetzten Minecraft-Versionen
# verwendet.
# ============================================================
mod_version=3.0.0
mod_group=de.bastild.restoreinv
mod_id=restoreinv
mod_archives_name=RestoreInventory

# ============================================================
# Unterstuetzte Minecraft-Versionen werden ueber Subprojekte
# unter versions/<mc>/ definiert. Jedes Subprojekt liefert seine
# eigenen minecraft_version, yarn_mappings, loader_version,
# fabric_api_version, fabric_loom_version und mod_dep_minecraft.
#
# Mit `python update_fabric.py` werden alle Subprojekte
# (oder ein einzelnes via --version) auf neueste Stand gehoben.
# ============================================================
