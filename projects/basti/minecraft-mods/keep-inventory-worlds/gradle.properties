# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod identity
maven_group=net.bastianklaus
archives_base_name=take-it-anywhere
mod_version=1.1.7

# --- Minecraft 1.21.1 (primary, verified target) ---
# To build for another 1.21.x version, swap the five values below.
# NOTE: 1.21.5+ changed several NBT/codec APIs (e.g. NbtCompound#getInt now
# returns Optional); see README "Building for other versions" for the deltas.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.10
fabric_version=0.115.0+1.21.1

# Optional integrations
modmenu_version=11.0.3
cloth_config_version=15.0.140
