<audio id="heehee" src="heehee.mp3"></audio>

<audio id="heehee" preload="auto">
    <source src="heehee.mp3" type="audio/mpeg">
</audio>

<script>
const sound = document.getElementById("heehee");

document.querySelectorAll("nav a").forEach(link => {
    link.addEventListener("click", function(event) {
        event.preventDefault();

        sound.currentTime = 0;

        sound.play().then(() => {
            sound.onended = () => {
                window.location.href = this.href;
            };
        }).catch(() => {
            // Falls das Abspielen fehlschlägt, trotzdem weiterleiten
            window.location.href = this.href;
        });
    });
});
</script>
